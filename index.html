<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Requirement: Correctly use a <meta> "description" tag -->
    <meta name="description" content="A personal website showcasing my projects and hobbies for EE461L.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <!-- Links to your external stylesheet -->
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <!-- Requirement: Create at least one id, apply it to an element -->
    <h1 id="main-title">Welcome to My Personal Website</h1>

    <!-- Requirement: Use <div> to create at least two sections -->
    <!-- Requirement: Create at least one class, apply it to at least two elements -->
    <div class="content-section">
        <h2>About Me</h2>
        <p>Hello! I am a student studying software engineering. I enjoy building things and learning new technologies.</p>
        
        <!-- Requirement: Include an image (safe for work) -->
        <img src="https://picsum.photos/300/200" alt="A nice placeholder image of nature">
    </div>

    <!-- Second div section reusing the same class -->
    <div class="content-section">
        <h2>My Projects</h2>
        <p>I have been working on some Python projects recently.</p>
        
        <!-- Requirement: Use <a> to link to another website -->
        <p>Check out my code here: <a href="https://github.com/ts5343/PythonReview" target="_blank">My GitHub Python Review Repo</a></p>
    </div>

</body>
</html>
